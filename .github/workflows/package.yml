name: Package tagged version

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Test tagged version
        shell: pwsh
        run: ./Test-NewReport.ps1

      - name: Upload report script
        uses: actions/upload-artifact@v4
        with:
          name: git-flow-lab-${{ github.ref_name }}
          path: New-Report.ps1
          if-no-files-found: error